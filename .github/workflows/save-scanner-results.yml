
name: Save Scanner Results

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Scanner
        run: |
          python trader-scanner/scan.py daily \
            --symbols AAPL,MSFT,NVDA \
            --min-price 5 \
            --min-volume 1000000 \
            --out trader/scan-daily.json \
            --json

      - name: Create timestamped Scanner result
        if: ${{ always() && hashFiles('trader/scan-daily.json') != '' }}
        run: |
          mkdir -p trader/history
          TIMESTAMP=$(date -u +'%Y-%m-%d_%H-%M-%S')
          cp trader/scan-daily.json \
            "trader/history/scan-daily-${TIMESTAMP}-${GITHUB_RUN_ID}.json"

      - name: Save Scanner artifact
        if: ${{ always() && hashFiles('trader/scan-daily.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: scanner-daily-${{ github.run_id }}
          path: |
            trader/scan-daily.json
            trader/history/*.json
          if-no-files-found: error
          retention-days: 30
