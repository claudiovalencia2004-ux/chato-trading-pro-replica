
name: Test Trader Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run original Scanner tests
        run: python -m unittest discover -s tests -p 'test_scanner.py' -v
