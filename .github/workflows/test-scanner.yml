
name: Test Trader Scanner


on:
  workflow_dispatch:
    inputs:
      test_group:
        description: 'Grupo de pruebas a ejecutar'
        required: true
        default: 'historical'
        type: choice
        options:
          - historical
          - connections
          - all


permissions:
  contents: read

jobs:
  test-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run original Scanner tests
        if: ${{ inputs.test_group == 'historical' || inputs.test_group == 'all' }}
        run: python -m unittest discover -s tests -p 'test_scanner.py' -v

      - name: Test Nasdaq universe offline
        if: ${{ inputs.test_group == 'historical' || inputs.test_group == 'all' }}
        run: |
          python trader-scanner/scan.py universe \
            --offline tests/fixtures/trader-scanner/symdir \
            --no-write \
            --json

            
      - name: Test daily Scanner offline
        if: ${{ inputs.test_group == 'historical' || inputs.test_group == 'all' }}
        run: |
          python trader-scanner/scan.py daily \
            --offline tests/fixtures/trader-scanner/daily-spark-2026-10-19.json \
            --now "2026-10-19 10:15" \
            --min-price 0 \
            --min-volume 0 \
            --no-write \
            --json

            
      - name: Test ORB Scanner offline
        if: ${{ inputs.test_group == 'historical' || inputs.test_group == 'all' }}
        run: |
          python trader-scanner/scan.py orb \
            --offline tests/fixtures/trader-scanner/wall5m-2026-10-19.json.gz \
            --now "2026-10-19 10:15" \
            --min-price 0 \
            --no-write \
            --json

            
      - name: Test Yahoo Finance connection
        if: ${{ inputs.test_group == 'connections' || inputs.test_group == 'all' }}
        run: |
          python trader-scanner/scan.py daily \
            --symbols AAPL,MSFT,NVDA \
            --min-price 5 \
            --min-volume 1000000 \
            --no-write \
            --json

            
      - name: Test live Nasdaq universe
        if: ${{ inputs.test_group == 'connections' || inputs.test_group == 'all' }}
        run: |
          python trader-scanner/scan.py universe \
            --no-write \
            --json

            
      - name: Test Yahoo Finance 20 symbols
        if: ${{ inputs.test_group == 'connections' || inputs.test_group == 'all' }}
        run: |
          python trader-scanner/scan.py daily \
            --symbols AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,AMD,INTC,AVGO,JPM,BAC,WMT,COST,KO,PEP,XOM,CVX,DIS,NFLX \
            --min-price 5 \
            --min-volume 1000000 \
            --no-write \
            --json





